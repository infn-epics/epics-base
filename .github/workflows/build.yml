name: Build and publish image to ghcr.io/epics-containers

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # pull requests are a duplicate of a branch push if within the same repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        epics-target: [linux-x86_64, linux-aarch64, RTEMS-pc686]
        #epics-target: [RTEMS-beatnik, linux-x86_64, linux-aarch64]
        include:
          - os: ubuntu-latest # everyone is on os-latest

          # native linux compile
          - epics-target: linux-x86_64
            epics-host: linux-x86_64
            name: epics-base
            base_image: ghcr.io/diamondlightsource/ubuntu-devcontainer:noble
            platform: linux/amd64

          # # cross compile for RTEMS to VME5500 (power pc beatnik)
          # - epics-target: RTEMS-beatnik
          #   epics-host: linux-x86_64
          #   name: epics-base-rtems-beatnik
          #   # NOTE: when changing this - also change it in '/build'
          #   base_image: ghcr.io/epics-containers/rtems-beatnik-runtime:6.1ec4
          #   platform: linux/amd64

          # cross compile for RTEMS to x86 VME boards (VMIVME-7750, pc686 BSP)
          - epics-target: RTEMS-pc686
            epics-host: linux-x86_64
            name: epics-base-rtems-pc686
            # NOTE: when changing this - also change it in '/build'
            base_image: ghcr.io/infn-epics/rtems-pc686-runtime:6.1inf1
            platform: linux/amd64

          # native linux/arm64 build (run via buildx+qemu on hosted runners)
          - epics-target: linux-aarch64
            epics-host: linux-aarch64
            name: epics-base-aarch64
            base_image: ubuntu:24.04
            platform: linux/arm64

    runs-on: ${{ matrix.os }}
    env:
      TAG: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          target: runtime
          build-args: |
            EPICS_TARGET_ARCH=${{ matrix.epics-target }}
            EPICS_HOST_ARCH=${{ matrix.epics-host }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=${{ matrix.epics-target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.epics-target }}
          load: true

      - name: Test RTEMS-pc686 in qemu
        if: ${{ matrix.epics-target == 'RTEMS-pc686' }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          target: developer
          build-args: |
            EPICS_TARGET_ARCH=${{ matrix.epics-target }}
            EPICS_HOST_ARCH=${{ matrix.epics-host }}
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.TAG }}-developer:test
          cache-from: type=gha,scope=${{ matrix.epics-target }}
          load: true

      - name: Run RTEMS-pc686 qemu smoke test
        if: ${{ matrix.epics-target == 'RTEMS-pc686' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends qemu-system-x86
          tests/qemu-softioc.sh ${{ env.TAG }}-developer:test

      - name: Push developer image
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          target: developer
          build-args: |
            EPICS_TARGET_ARCH=${{ matrix.epics-target }}
            EPICS_HOST_ARCH=${{ matrix.epics-host }}
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.TAG }}-developer:${{ github.ref_name }}
          push: true

      - name: Push runtime image
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          target: runtime
          build-args: |
            EPICS_TARGET_ARCH=${{ matrix.epics-target }}
            EPICS_HOST_ARCH=${{ matrix.epics-host }}
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.TAG }}-runtime:${{ github.ref_name }}
          push: true
